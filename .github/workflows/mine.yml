name: Run Pixel Miner

on:
  schedule:
    - cron: "0 */12 * * *" # Läuft vollautomatisch alle 12 Stunden
  workflow_dispatch: # Erlaubt es dir, den Miner jederzeit manuell zu starten

jobs:
  mine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - uses: actions/setup-node@v3
        with:
          node-version: 18
          
      - run: node index.js
      
      - uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "Miner secured more ores"
          file_pattern: "mining-grid.svg"
