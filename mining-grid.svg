<rect x="85" y="55" width="12" height="12" rx="2" fill="#161b22"  />
<rect x="85" y="70" width="12" height="12" rx="2" fill="#0e4429"  />
<rect x="85" y="85" width="12" height="12" rx="2" fill="#161b22"  />
<rect x="85" y="100" width="12" height="12" rx="2" fill="#39d353" style="animation: crystalGlow 2s infinite alternate;" />
<rect x="85" y="115" width="12" height="12" rx="2" fill="#006d32"  />
