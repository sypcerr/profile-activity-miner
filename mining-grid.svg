<rect x="55" y="55" width="12" height="12" rx="2" fill="#26a641"  />
<rect x="55" y="70" width="12" height="12" rx="2" fill="#39d353" style="animation: crystalGlow 2s infinite alternate;" />
<rect x="55" y="85" width="12" height="12" rx="2" fill="#161b22"  />
<rect x="55" y="100" width="12" height="12" rx="2" fill="#006d32"  />
<rect x="55" y="115" width="12" height="12" rx="2" fill="#0e4429"  />
<rect x="70" y="25" width="12" height="12" rx="2" fill="#161b22"  />
<rect x="70" y="40" width="12" height="12" rx="2" fill="#161b22"  />
<rect x="70" y="55" width="12" height="12" rx="2" fill="#0e4429"  />
<rect x="70" y="70" width="12" height="12" rx="2" fill="#006d32"  />
<rect x="70" y="85" width="12" height="12" rx="2" fill="#39d353" style="animation: crystalGlow 2s infinite alternate;" />
<rect x="70" y="100" width="12" height="12" rx="2" fill="#161b22"  />
<rect x="70" y="115" width="12" height="12" rx="2" fill="#161b22"  />
