<svg xmlns="http://www.w3.org/2000/svg" width="175" height="160" viewBox="0 0 175 160">
    <style>
        @keyframes mineWalk {
            0% { transform: translate(0px, 0px); }
            45% { transform: translate(85px, 0px); }
            50% { transform: translate(85px, 0px) scaleX(-1); }
            95% { transform: translate(0px, 0px) scaleX(-1); }
            100% { transform: translate(0px, 0px) scaleX(1); }
        }
        @keyframes pickaxeSwing {
            0% { transform: rotate(0deg); }
            50% { transform: rotate(-60deg); }
            100% { transform: rotate(0deg); }
        }
        @keyframes crystalGlow {
            0% { filter: drop-shadow(0 0 1px #39d353); }
            100% { fill: #a3ffb4; filter: drop-shadow(0 0 4px #39d353); }
        }
        .miner-engine {
            animation: mineWalk 20s infinite linear;
            transform-origin: center;
        }
        .tool-swing {
            transform-origin: 18px 25px;
            animation: pickaxeSwing 0.6s infinite ease-in-out;
        }
    </style>

    <rect width="100%" height="100%" fill="#0d1117" rx="10" />

    <rect x="40" y="25" width="12" height="12" rx="2" fill="#161b22"  />
<rect x="40" y="40" width="12" height="12" rx="2" fill="#0e4429"  />
<rect x="40" y="55" width="12" height="12" rx="2" fill="#006d32"  />
<rect x="40" y="70" width="12" height="12" rx="2" fill="#161b22"  />
<rect x="40" y="85" width="12" height="12" rx="2" fill="#39d353" style="animation: crystalGlow 2s infinite alternate;" />
<rect x="40" y="100" width="12" height="12" rx="2" fill="#0e4429"  />
<rect x="40" y="115" width="12" height="12" rx="2" fill="#161b22"  />
<rect x="55" y="25" width="12" height="12" rx="2" fill="#0e4429"  />
